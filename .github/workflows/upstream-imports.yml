{
  "name": "Upstream imports",
  "on": {
    "schedule": [
      {
        "cron": "17 5 * * 1"
      }
    ],
    "workflow_dispatch": {}
  },
  "permissions": {
    "contents": "read"
  },
  "concurrency": {
    "group": "upstream-imports",
    "cancel-in-progress": false
  },
  "jobs": {
    "propose": {
      "if": "github.ref == 'refs/heads/main'",
      "runs-on": "ubuntu-latest",
      "timeout-minutes": 10,
      "permissions": {
        "contents": "write",
        "pull-requests": "write"
      },
      "steps": [
        {
          "uses": "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1",
          "with": {
            "ref": "main",
            "persist-credentials": false
          }
        },
        {
          "uses": "actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38",
          "with": {
            "node-version": "22.19.0"
          }
        },
        {
          "name": "Prepare one draft update PR",
          "run": "node tools/propose-upstream.mjs",
          "env": {
            "GH_TOKEN": "${{ github.token }}"
          }
        }
      ]
    }
  }
}
