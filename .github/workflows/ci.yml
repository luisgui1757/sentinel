name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  test:
    name: test
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - name: Install tools (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y jq shellcheck bats
      - name: Install tools (macOS)
        if: runner.os == 'macOS'
        run: brew install jq bats-core shellcheck
      # The 4 lint validators live in the `lint` job (where they run STRICT); this
      # job carries jq/shellcheck/bats, so `make ci`'s lint step skips the absent
      # validators loudly (non-strict) while ShellCheck (present) stays blocking.
      - name: Preflight (leak scan + render smoke + adapter drift + rulesets + shellcheck)
        run: make ci
      - name: Tooling tests (bats)
        run: make test
        env:
          SENTINEL_STRICT: "1"   # the suite MUST run here; a missing bats fails, never skips

  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SENTINEL_STRICT: "1"   # every linter must run; a missing one fails the gate
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          fetch-depth: 0   # gitleaks scans full history
      - name: Install linters
        run: |
          set -euxo pipefail
          # The generated lock pins the complete transitive graph and every
          # accepted artifact digest. Renovate regenerates it from the two
          # direct pins in ci-requirements.in.
          python3 -m pip install --user --require-hashes \
            -r .github/ci-requirements.txt
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          # Each pinned version travels with its asset sha256: download, verify,
          # then extract. A yanked/retagged/tampered upstream asset fails loudly
          # instead of silently executing in CI.
          ec_ver=4.0.2
          ec_sha=9a0c3a5170bffa24f9e5f0def53d285777b6c5284a95367f40d399d0b76af552
          ec_url="https://github.com/editorconfig-checker/editorconfig-checker"
          curl -fsSL -o ec.tar.gz \
            "${ec_url}/releases/download/v${ec_ver}/ec-linux-amd64.tar.gz"
          echo "${ec_sha}  ec.tar.gz" | sha256sum -c -
          tar -xzf ec.tar.gz
          sudo install -m 0755 bin/ec-linux-amd64 /usr/local/bin/editorconfig-checker
          gl_ver=8.30.1
          gl_sha=551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
          gl_url="https://github.com/gitleaks/gitleaks"
          curl -fsSL -o gitleaks.tar.gz \
            "${gl_url}/releases/download/v${gl_ver}/gitleaks_${gl_ver}_linux_x64.tar.gz"
          echo "${gl_sha}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
      - name: Lint (yaml + editorconfig + secrets + schema)
        run: make lint

  # Native Windows proof that the PowerShell installer renders byte-identically to
  # the bash one: -Check fails if the committed entrypoints drift under the PS
  # renderer (CRLF, encoding, or logic divergence). The Linux `test` job already
  # cross-checks bash-vs-pwsh output (bats); this guards the real Windows runtime.
  windows:
    name: windows
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - name: PowerShell installer drift check
        shell: pwsh
        run: ./tools/install.ps1 -Check

  dependency_review:
    name: dependency-review
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Review dependency changes
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294  # v5.0.0
      - name: Mark non-pull-request runs successful
        if: github.event_name != 'pull_request'
        run: echo 'dependency review applies to pull requests only'

  # Stable required-status-check context. The branch-protection rulesets require
  # `ci`. It runs ALWAYS (so the required context is never reported as "skipped",
  # which some GitHub configs treat as passing) and FAILS unless every matrix
  # `test`, `lint`, `windows`, and `dependency_review` jobs succeeded.
  ci:
    name: ci
    needs: [test, lint, windows, dependency_review]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Require all prerequisite jobs to have succeeded
        run: |
          if [ "${{ needs.test.result }}" != "success" ] \
             || [ "${{ needs.lint.result }}" != "success" ] \
             || [ "${{ needs.windows.result }}" != "success" ] \
             || [ "${{ needs.dependency_review.result }}" != "success" ]; then
            echo "test=${{ needs.test.result }} lint=${{ needs.lint.result }}" >&2
            echo "windows=${{ needs.windows.result }}" >&2
            echo "dependency-review=${{ needs.dependency_review.result }}" >&2
            echo "failing the required ci check" >&2
            exit 1
          fi
          echo "all prerequisite jobs passed"
