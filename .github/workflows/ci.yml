name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Each runner has pwsh. Linux and macOS also test the bash installer.
  test:
    name: test
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38  # v6
        with:
          node-version: "22.23.4"
      - name: Installer and import tests
        run: node --test "tests/*.test.mjs"

  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0  # gitleaks reads the full history
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38  # v6
        with:
          node-version: "22.23.4"
      - name: Shell script, home paths and STE prose
        run: make lint
      - name: Secrets
        run: |
          set -euo pipefail
          gl_ver=8.30.1
          gl_sha=551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
          curl -fsSL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${gl_ver}/gitleaks_${gl_ver}_linux_x64.tar.gz"
          echo "${gl_sha}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks git --no-banner --redact .

  upstream:
    name: upstream
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38  # v6
        with:
          node-version: "22.23.4"
      - name: Pinned upstream sources give the same files
        run: node tools/upstream.mjs --verify
        env:
          GH_TOKEN: ${{ github.token }}

  dependency_review:
    name: dependency-review
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Review dependency changes
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294  # v5.0.0
      - name: Pass on pushes
        if: github.event_name != 'pull_request'
        run: echo 'dependency review applies to pull requests only'

  # Branch protection requires this check. It always runs, and it fails unless
  # each job above passed.
  ci:
    name: ci
    needs: [test, lint, upstream, dependency_review]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: All jobs passed
        run: |
          if [ "${{ needs.test.result }}" != success ] \
             || [ "${{ needs.lint.result }}" != success ] \
             || [ "${{ needs.upstream.result }}" != success ] \
             || [ "${{ needs.dependency_review.result }}" != success ]; then
            echo "test=${{ needs.test.result }} lint=${{ needs.lint.result }}" >&2
            echo "upstream=${{ needs.upstream.result }} dependency-review=${{ needs.dependency_review.result }}" >&2
            exit 1
          fi
