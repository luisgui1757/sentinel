name: ci
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Pipeline tests
        run: PYTHONPATH=pipeline/src python3 -m unittest discover -s pipeline/tests
      - name: Rust crates
        run: cargo check --quiet --manifest-path crates/Cargo.toml
