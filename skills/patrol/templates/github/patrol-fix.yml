name: patrol-fix

on:
  schedule:
    - cron: "17 3 * * 1-5"
  workflow_dispatch:

concurrency:
  group: patrol-fix
  cancel-in-progress: false

permissions: {}

jobs:
  claim:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    outputs:
      found: ${{ steps.claim.outputs.found }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - id: claim
        run: node tools/patrol/patrol.mjs claim --forge github --out "$RUNNER_TEMP/item.json"
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
      - if: steps.claim.outputs.found == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: item
          path: ${{ runner.temp }}/item.json

  agent:
    needs: claim
    if: needs.claim.outputs.found == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/download-artifact@v8
        with:
          name: item
          path: ${{ runner.temp }}
      - run: npm install --global @openai/codex@0.166.0
      - run: printenv OPENAI_API_KEY | codex login --with-api-key
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      - run: node tools/patrol/patrol.mjs agent --prompt tools/patrol/prompts/fix.md --item "$RUNNER_TEMP/item.json" --out "$RUNNER_TEMP/out" --minutes 45
        env:
          PATROL_AGENT: codex exec --dangerously-bypass-approvals-and-sandbox --skip-git-repo-check -
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: out
          path: ${{ runner.temp }}/out

  publish:
    needs: [claim, agent]
    if: always() && needs.claim.outputs.found == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.PATROL_GH_TOKEN || github.token }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/artifacts
      - run: |
          git config user.name patrol
          git config user.email patrol@users.noreply.github.com
          node tools/patrol/patrol.mjs publish --forge github --mode pr --in "$RUNNER_TEMP/artifacts/out" --item "$RUNNER_TEMP/artifacts/item/item.json" --base "$GITHUB_REF_NAME"
        env:
          GH_TOKEN: ${{ secrets.PATROL_GH_TOKEN || github.token }}
          GH_REPO: ${{ github.repository }}
