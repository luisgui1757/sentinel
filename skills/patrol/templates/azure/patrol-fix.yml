trigger: none
pr: none

schedules:
  - cron: "17 3 * * 1-5"
    displayName: patrol fix
    branches:
      include:
        - main
    always: true

variables:
  - group: patrol

pool:
  vmImage: ubuntu-latest

jobs:
  - job: claim
    timeoutInMinutes: 5
    steps:
      - checkout: self
        fetchDepth: 1
      - task: UseNode@1
        inputs:
          version: "22.x"
      - script: |
          az extension add --name azure-devops --only-show-errors
          node tools/patrol/patrol.mjs claim --forge azure --out "$(Agent.TempDirectory)/item.json"
        name: claim
        env:
          AZURE_DEVOPS_EXT_PAT: $(System.AccessToken)
      - publish: $(Agent.TempDirectory)/item.json
        artifact: item
        condition: eq(variables['claim.found'], 'true')

  - job: agent
    dependsOn: claim
    condition: eq(dependencies.claim.outputs['claim.found'], 'true')
    timeoutInMinutes: 60
    steps:
      - checkout: self
        fetchDepth: 1
        persistCredentials: false
      - task: UseNode@1
        inputs:
          version: "22.x"
      - download: current
        artifact: item
      - task: DownloadSecureFile@1
        name: codexConfig
        inputs:
          secureFile: codex-config.toml
      - script: |
          mkdir -p "$HOME/.codex"
          cp "$(codexConfig.secureFilePath)" "$HOME/.codex/config.toml"
          npm install --global @openai/codex@0.166.0
        displayName: Install the agent
      - script: node tools/patrol/patrol.mjs agent --prompt tools/patrol/prompts/fix.md --item "$(Pipeline.Workspace)/item/item.json" --out "$(Agent.TempDirectory)/out" --minutes 45
        displayName: Run the agent
        target:
          settableVariables: none
        env:
          PATROL_AGENT: codex exec --dangerously-bypass-approvals-and-sandbox --skip-git-repo-check -
          AZURE_OPENAI_API_KEY: $(AZURE_OPENAI_API_KEY)
      - publish: $(Agent.TempDirectory)/out
        artifact: out
        condition: always()

  - job: publish
    dependsOn: [claim, agent]
    condition: and(always(), eq(dependencies.claim.outputs['claim.found'], 'true'))
    timeoutInMinutes: 10
    steps:
      - checkout: self
        fetchDepth: 0
        persistCredentials: true
      - task: UseNode@1
        inputs:
          version: "22.x"
      - download: current
      - script: |
          az extension add --name azure-devops --only-show-errors
          git config user.name patrol
          git config user.email patrol@example.invalid
          node tools/patrol/patrol.mjs publish --forge azure --mode pr --in "$(Pipeline.Workspace)/out" --item "$(Pipeline.Workspace)/item/item.json" --base main
        env:
          AZURE_DEVOPS_EXT_PAT: $(System.AccessToken)
