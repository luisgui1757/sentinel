patrol-verify-agent:
  stage: test
  image: node:22
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_DRAFT != "true" && $CI_MERGE_REQUEST_SOURCE_PROJECT_ID == $CI_PROJECT_ID
  timeout: 45 minutes
  variables:
    GIT_DEPTH: 0
    PATROL_AGENT: codex exec --dangerously-bypass-approvals-and-sandbox --skip-git-repo-check -
  script:
    - export PR_BASE="$CI_MERGE_REQUEST_DIFF_BASE_SHA" PR_HEAD="${CI_MERGE_REQUEST_SOURCE_BRANCH_SHA:-$CI_COMMIT_SHA}"
    - git checkout --quiet --detach "$PR_HEAD"
    - npm install --global @openai/codex@0.166.0
    - mkdir -p ~/.codex && cp "$CODEX_CONFIG" ~/.codex/config.toml
    - node tools/patrol/patrol.mjs agent --prompt tools/patrol/prompts/verify.md --out /tmp/patrol-out --minutes 30 || status=$?
    - mkdir -p .patrol && cp -R /tmp/patrol-out .patrol/out
    - exit "${status:-0}"
  artifacts:
    when: always
    paths:
      - .patrol/out/
    expire_in: 1 day

patrol-verify-publish:
  stage: test
  image: node:22
  needs: [patrol-verify-agent]
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_DRAFT != "true" && $CI_MERGE_REQUEST_SOURCE_PROJECT_ID == $CI_PROJECT_ID
      when: always
  environment:
    name: patrol-verify
    action: access
  timeout: 10 minutes
  variables:
    GIT_STRATEGY: clone
    GIT_DEPTH: 0
  script:
    - git checkout --quiet --detach "$CI_MERGE_REQUEST_DIFF_BASE_SHA"
    - node tools/patrol/patrol.mjs publish --forge gitlab --mode comment --in .patrol/out --pr "$CI_MERGE_REQUEST_IID"
